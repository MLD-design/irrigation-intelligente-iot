
services:
  mysql:
    image: mysql:8.0
    container_name: irrigation-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - irrigation-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/mld-design/irrigation-intelligente-iot-backend:latest
    container_name: irrigation-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      IRRIGATION_DEVICE_KEY: ${IRRIGATION_DEVICE_KEY}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8082:8081"
    networks:
      - irrigation-network

  frontend:
    image: ghcr.io/mld-design/irrigation-intelligente-iot-frontend:latest
    container_name: irrigation-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - irrigation-network

volumes:
  mysql_data:

networks:
  irrigation-network:
    driver: bridge

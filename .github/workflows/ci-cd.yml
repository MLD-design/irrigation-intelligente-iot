
name: CI/CD - Irrigation intelligente IoT

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend - Spring Boot
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Compiler et tester
        working-directory: backend
        run: chmod +x mvnw && ./mvnw --batch-mode verify

  frontend:
    name: Frontend - React
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Installer les dépendances
        working-directory: frontend-react
        run: npm ci

      - name: Vérifier le code
        working-directory: frontend-react
        run: npm run lint

      - name: Construire le frontend
        working-directory: frontend-react
        run: npm run build

  firmware:
    name: Firmware - ESP32
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer PlatformIO
        run: pip install platformio

      - name: Préparer les secrets de compilation
        working-directory: firmware
        run: |
          if [ ! -f src/secrets.h ]; then
            touch src/secrets.h
          fi

      - name: Compiler le firmware
        working-directory: firmware
        run: pio run

  docker:
    name: Vérifier les images Docker
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - firmware
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image backend
        run: docker build -t irrigation-backend:ci ./backend

      - name: Construire l'image frontend
        run: docker build -t irrigation-frontend:ci ./frontend-react


name: CI/CD - Irrigation intelligente IoT

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend - Spring Boot
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Installer Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.12'

      - name: Compiler et tester
        working-directory: backend
        run: mvn --batch-mode verify

  frontend:
    name: Frontend - React
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Installer les dependances
        working-directory: frontend-react
        run: npm ci

      - name: Verifier le code
        working-directory: frontend-react
        run: npm run lint

      - name: Construire le frontend
        working-directory: frontend-react
        run: npm run build

  firmware:
    name: Firmware - ESP32
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer PlatformIO
        run: pip install platformio

      - name: Preparer les secrets de compilation
        working-directory: firmware
        run: cp src/secrets_example.h src/secrets.h

      - name: Compiler le firmware ESP32
        working-directory: firmware
        run: pio run

  docker:
    name: Construire et publier les images Docker
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend
      - firmware

    permissions:
      contents: read
      packages: write

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter a GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier le backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/mld-design/irrigation-intelligente-iot-backend:latest
            ghcr.io/mld-design/irrigation-intelligente-iot-backend:${{ github.sha }}

      - name: Construire et publier le frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-react
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/mld-design/irrigation-intelligente-iot-frontend:latest
            ghcr.io/mld-design/irrigation-intelligente-iot-frontend:${{ github.sha }}


name: CI/CD - Irrigation intelligente IoT

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Tests Backend - Spring Boot
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: irrigation_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/irrigation_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Installer Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.12'

      - name: Compiler et tester
        working-directory: backend
        run: mvn --batch-mode verify

  frontend:
    name: Tests Frontend - React
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Installer les dependances
        working-directory: frontend-react
        run: npm ci

      - name: Verifier le code
        working-directory: frontend-react
        run: npm run lint

      - name: Construire le frontend
        working-directory: frontend-react
        run: npm run build

  firmware:
    name: Compilation Firmware ESP32
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Construire l'image firmware-builder
        uses: docker/build-push-action@v6
        with:
          context: ./firmware
          file: ./firmware/Dockerfile
          push: false
          load: true
          tags: irrigation-firmware-builder:ci

      - name: Preparer les secrets de compilation
        shell: bash
        run: cp firmware/src/secrets_example.h firmware/src/secrets.h

      - name: Compiler le firmware dans Docker
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/firmware:/workspace" \
            irrigation-firmware-builder:ci

  docker:
    name: Construire et publier les trois images GHCR
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend
      - firmware

    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier le backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/mld-design/irrigation-intelligente-iot-backend:latest
            ghcr.io/mld-design/irrigation-intelligente-iot-backend:${{ github.sha }}

      - name: Publier le frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-react
          push: true
          build-args: |
            VITE_API_URL=/api/v1
          tags: |
            ghcr.io/mld-design/irrigation-intelligente-iot-frontend:latest
            ghcr.io/mld-design/irrigation-intelligente-iot-frontend:${{ github.sha }}

      - name: Publier firmware-builder
        uses: docker/build-push-action@v6
        with:
          context: ./firmware
          file: ./firmware/Dockerfile
          push: true
          tags: |
            ghcr.io/mld-design/irrigation-intelligente-iot-firmware-builder:latest
            ghcr.io/mld-design/irrigation-intelligente-iot-firmware-builder:${{ github.sha }}

  deploy:
    name: Deploiement Docker sur le PC Windows
    runs-on: [self-hosted, Windows, X64]
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass {0}

    steps:
      - name: Verifier Docker
        run: |
          docker info
          if ($LASTEXITCODE -ne 0) {
            throw "Docker Desktop n'est pas accessible"
          }

      - name: Se connecter a GHCR
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USER: MLD-design
        run: |
          $env:GHCR_READ_TOKEN | docker login ghcr.io -u $env:GHCR_USER --password-stdin
          if ($LASTEXITCODE -ne 0) {
            throw "Echec de connexion a GHCR"
          }

      - name: Verifier le dossier de deploiement
        run: |
          $projectPath = "C:\Users\SBS\irrigation-intelligente-iot"
          if (-not (Test-Path "$projectPath\compose.yaml")) {
            throw "Le fichier compose.yaml est introuvable"
          }

      - name: Recuperer les nouvelles images
        run: |
          docker compose -f "C:\Users\SBS\irrigation-intelligente-iot\compose.yaml" pull backend frontend
          if ($LASTEXITCODE -ne 0) {
            throw "Echec de recuperation des images"
          }

      - name: Deployer backend et frontend
        run: |
          docker compose -f "C:\Users\SBS\irrigation-intelligente-iot\compose.yaml" up -d --no-deps backend frontend
          if ($LASTEXITCODE -ne 0) {
            throw "Echec du deploiement"
          }

      - name: Verifier les conteneurs
        run: |
          docker ps --filter "name=irrigation-backend"
          docker ps --filter "name=irrigation-frontend"

      - name: Nettoyer les anciennes images inutilisees
        run: docker image prune -f
